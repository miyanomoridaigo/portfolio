<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>miyanomoridaigo — Portfolio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #30363d;
      --accent: #58a6ff;
      --accent2: #79c0ff;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --tag-bg: #1f2d3d;
      --tag-text: #79c0ff;
      --radius: 12px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(180deg, #0d1117 0%, #161b22 100%);
      border-bottom: 1px solid var(--border);
      padding: 64px 24px 48px;
      text-align: center;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      box-shadow: 0 0 0 6px rgba(88,166,255,.15);
      margin-bottom: 20px;
    }

    .header-name {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .header-sub {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      padding: 6px 16px;
      border-radius: 20px;
      transition: background .2s, border-color .2s;
    }
    .github-link:hover { background: var(--surface2); border-color: var(--accent); }

    .github-icon { width: 18px; height: 18px; fill: currentColor; vertical-align: middle; }

    /* ── Stats bar ── */
    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .stat { text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; }

    /* ── Filter ── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 32px 24px 16px;
      max-width: 1100px;
      margin: 0 auto;
      min-height: 60px;
    }

    .filter-btn {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all .2s;
    }
    .filter-btn:hover,
    .filter-btn.active {
      background: var(--accent);
      color: #0d1117;
      border-color: var(--accent);
      font-weight: 600;
    }

    /* ── Grid ── */
    .grid-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 24px 80px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(88,166,255,.15);
    }
    .card.hidden { display: none; }

    .card-preview {
      position: relative;
      height: 180px;
      overflow: hidden;
      background: var(--surface2);
    }
    .card-preview iframe {
      width: 200%;
      height: 200%;
      border: none;
      transform: scale(.5);
      transform-origin: 0 0;
      pointer-events: none;
    }
    .card-preview-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, var(--surface) 100%);
    }

    .card-body {
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-category {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      flex: 1;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .tag {
      font-size: 0.72rem;
      background: var(--tag-bg);
      color: var(--tag-text);
      padding: 2px 9px;
      border-radius: 20px;
      border: 1px solid rgba(121,192,255,.2);
    }

    .card-links {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: all .2s;
      border: none;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #0d1117; }
    .btn-primary:hover { background: var(--accent2); }
    .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Skeleton ── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, var(--surface2) 25%, #252d38 50%, var(--surface2) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 4px;
    }
    .skeleton-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .skeleton-preview { height: 180px; }
    .skeleton-body { padding: 16px 18px 18px; }
    .skeleton-line { height: 12px; margin-bottom: 10px; }
    .skeleton-line.w-40  { width: 40%; }
    .skeleton-line.w-70  { width: 70%; }
    .skeleton-line.w-100 { width: 100%; }
    .skeleton-line.h-16  { height: 16px; }

    /* ── Error ── */
    .error-box {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-muted);
    }
    .error-box p { margin-bottom: 16px; }
    .retry-btn {
      display: inline-block;
      padding: 8px 20px;
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 600px) {
      .header-name { font-size: 1.5rem; }
      .stats { gap: 24px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

    'voice-recorder':           'ブラウザ録音 + Cloudflare R2',

    'mywiki':                   'パーソナル Wiki',
    'novelist_journal':         'Novelist\'s Journal',

  const DESCRIPTIONS = {
    'pyramid-dream':            'ピラミッド構造で目標を可視化・管理するアプリ。下位の小さな夢を積み上げて大きな目標へ向かう進捗をブロックで表示。Firebase によるクラウド同期に対応。',

    'dream':                    '人生目標・夢を整理・追跡するアプリ。マイルストーン管理・習慣ログ・タイムライン・カレンダービューなど多彩な機能でゴールへの進捗を可視化。Firebase でデータ保存。',
    'journal':                  'タスク・習慣チェックリスト、睡眠記録、完了率グラフを備えたクリエイター向け日課トラッカー。Firebase 同期と JSON/CSV エクスポートに対応。',
    'graph-planner':            '時計盤風の円形UIで24時間のスケジュールを可視化するプランナー。ドラッグで予定を追加し、色分けされた弧で表示。リアルタイム時刻インジケーター付き。',
    'voice-recorder':           'ブラウザのマイクで録音し、Cloudflare R2 オブジェクトストレージへ自動アップロードするアプリ。日付別ファイルブラウザで録音の再生・ダウンロード・管理が可能。',
    'market-checker':           'カクヨムのジャンル別ランキングを集計・分析するダッシュボード。棒グラフ・ドーナツグラフ・トレンドグラフで傾向を可視化し、Python スクリプトで毎日自動収集に対応。',
    'mywiki':                   'Markdown・WikiLinks 対応のパーソナルWikiアプリ。GitHub Gist / Firebase / Supabase の4バックエンドで同期可能。ページ関係グラフ、全文検索、キーボードショートカット付き。',
    'novelist_journal':         '小説家のための執筆記録アプリ。日次の文字数・気分・メモ管理、目標設定、アイデアバンク、タスクリスト、統計ダッシュボードを搭載。Supabase でクラウド同期。',
    'novel-settings-in-chat':   'チャット形式で物語を企画する対話型ツール。コンセプト→キャラクター→テーマ→構成→プロットの6フェーズを順番に設問形式で進める。三幕構成・起承転結などに対応。',
    'novelist-note':            'テーマ・感情・動機・理想の読者を整理するビジョン手帳。複数プロジェクトを管理でき、Firebase Firestore へリアルタイム自動保存。原稿用紙風の暖かいデザイン。',
    'myeditor':                 '縦書き・横書きを切り替えられるローカルファイルエディタ。File System Access API でフォルダを直接編集。ダーク/ライト/セピアテーマ、空白可視化、マルチタブに対応。',
    'world-settings':           '小説・創作の世界観を地理・歴史・社会・魔法など13カテゴリで整理するツール。進捗バー付きでまとめの完成度を確認でき、Markdown エクスポートと Supabase 同期が可能。',
    'think_and_grow_rich':      'ナポレオン・ヒル著「思考は現実化する」の13原則を体系的に学ぶインタラクティブ学習プラットフォーム。演習問題・ワークシート・小テストで理解を深め、進捗をローカル保存。',

  // ── Tags ─────────────────────────────────────────────────────────────────
  const TAGS = {
    'pyramid-dream':            ['Goals', 'Visualization', 'Firebase'],
    'tiraura':                  ['Web Novel', 'Reader', '日本語'],
    'dream':                    ['Goals', 'Habits', 'Firebase'],
    'journal':                  ['Habits', 'Tracker', 'Firebase'],
    'graph-planner':            ['Scheduler', 'Visualization', 'Firebase'],
    'voice-recorder':           ['Audio', 'Cloudflare R2', 'Storage'],
    'market-checker':           ['Analytics', 'Kakuyomu', 'Firebase'],
    'mywiki':                   ['Wiki', 'Markdown', 'Multi-backend'],
    'novelist_journal':         ['Writing', 'Productivity', 'Supabase'],
    'novel-settings-in-chat':   ['Storytelling', 'Planning', 'Firebase'],
    'novelist-note':            ['Writing', 'Notebook', 'Firebase'],
    'myeditor':                 ['Editor', '縦書き', 'File API'],
    'world-settings':           ['Worldbuilding', 'Supabase', 'Markdown'],
    'think_and_grow_rich':      ['Self-Help', 'E-Learning', 'LocalStorage'],
    'high_concept_idea_generator': ['Brainstorming', 'SciFi', 'Workbook'],
  };

  // ── Category map (manual overrides) ──────────────────────────────────────
  const CATEGORY_MAP = {
    'pyramid-dream':            'goals',
    'tiraura':                  'webnovel',
    'dream':                    'goals',
    'journal':                  'goals',
    'graph-planner':            'goals',
    'voice-recorder':           'utility',
    'market-checker':           'webnovel',
    'mywiki':                   'utility',
    'novelist_journal':         'writing',
    'novel-settings-in-chat':   'writing',
    'novelist-note':            'writing',
    'myeditor':                 'writing',
    'world-settings':           'writing',
    'think_and_grow_rich':      'learning',
    'high_concept_idea_generator': 'writing',
  };

  const CATEGORY_LABELS = {
    goals:    'Goals & Planning',
    writing:  'Writing Tools',
    webnovel: 'Web Novel',
    utility:  'Utilities',
    learning: 'Learning',
    other:    'Other',
  };

  // ── Auto-detect category from repo name ──────────────────────────────────
  function detectCategory(name) {
    if (CATEGORY_MAP[name]) return CATEGORY_MAP[name];
    const n = name.toLowerCase();
    if (/novelist|novel|editor|story|world|high.concept/.test(n)) return 'writing';
    if (/dream|journal|planner|graph/.test(n))                     return 'goals';
    if (/tiraura|market|kakuyomu/.test(n))                         return 'webnovel';
    if (/wiki|voice/.test(n))                                      return 'utility';
    if (/think|grow|rich|learn/.test(n))                           return 'learning';
    return 'other';
  }

  // ── Format repo name as title ─────────────────────────────────────────────
  function formatTitle(name) {
    if (TITLES[name]) return TITLES[name];
    return name.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  // ── External link SVG ─────────────────────────────────────────────────────
  const LINK_ICON = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

  // ── Render a single card ──────────────────────────────────────────────────
  function renderCard(repo) {
    const name      = repo.name;
    const pagesUrl  = `https://${GITHUB_USER}.github.io/${name}/`;
    const repoUrl   = repo.html_url;
    const title     = formatTitle(name);
    const subtitle  = SUBTITLES[name] || '';
    const desc      = repo.description || DESCRIPTIONS[name] || '（説明なし）';
    const category  = detectCategory(name);
    const catLabel  = CATEGORY_LABELS[category] || category;
    const tags      = TAGS[name] || (repo.language ? [repo.language] : []);
    const tagHtml   = tags.map(t => `<span class="tag">${t}</span>`).join('');

    return `
      <div class="card" data-category="${category}">
        <div class="card-preview">
          <iframe src="${pagesUrl}" loading="lazy" title="${title}"></iframe>
          <div class="card-preview-overlay"></div>
        </div>
        <div class="card-body">
          <div class="card-category">${catLabel}</div>
          <div class="card-title">${title}</div>
          ${subtitle ? `<div class="card-subtitle">${subtitle}</div>` : ''}
          <p class="card-desc">${desc}</p>
          ${tagHtml ? `<div class="card-tags">${tagHtml}</div>` : ''}
          <div class="card-links">
            <a class="btn btn-primary" href="${pagesUrl}" target="_blank" rel="noopener">${LINK_ICON} 開く</a>
            <a class="btn btn-ghost"   href="${repoUrl}"  target="_blank" rel="noopener">GitHub</a>
          </div>
        </div>
      </div>`;
  }

  // ── Render filter buttons ─────────────────────────────────────────────────
  function renderFilters(repos) {
    const used = new Set(repos.map(r => detectCategory(r.name)));
    const bar  = document.getElementById('filterBar');
    const all  = ['goals', 'writing', 'webnovel', 'utility', 'learning', 'other']
      .filter(c => used.has(c));

    bar.innerHTML = `<button class="filter-btn active" data-filter="all">All</button>` +
      all.map(c => `<button class="filter-btn" data-filter="${c}">${CATEGORY_LABELS[c]}</button>`).join('');

    bar.addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filter = btn.dataset.filter;
      document.querySelectorAll('#projectGrid .card').forEach(card => {
        card.classList.toggle('hidden', filter !== 'all' && card.dataset.category !== filter);
      });
    });
  }

  // ── Fetch repos (with sessionStorage cache) ───────────────────────────────
  async function fetchRepos() {
    const cached = sessionStorage.getItem(CACHE_KEY);
    if (cached) {
      try {
        const { ts, data } = JSON.parse(cached);
        if (Date.now() - ts < CACHE_TTL) return data;
      } catch (_) { /* ignore */ }
    }

    const res = await fetch(
      `https://api.github.com/users/${GITHUB_USER}/repos?per_page=100&sort=updated`
    );
    if (!res.ok) throw new Error(`GitHub API: ${res.status}`);
    const all  = await res.json();
    const data = all.filter(r => r.has_pages && r.name !== 'portfolio');
    sessionStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data }));
    return data;
  }

  // ── Main ──────────────────────────────────────────────────────────────────
  async function init() {
    const grid = document.getElementById('projectGrid');
    try {
      const repos = await fetchRepos();
      document.getElementById('statCount').textContent = repos.length;
      grid.innerHTML = repos.map(renderCard).join('');
      renderFilters(repos);
    } catch (err) {
      grid.innerHTML = `
        <div class="error-box" style="grid-column:1/-1">
          <p>リポジトリの取得に失敗しました。<br><small>${err.message}</small></p>
          <button class="retry-btn" onclick="init()">再試行</button>
        </div>`;
    }
  }

  init();
</script>
</body>
</html>
